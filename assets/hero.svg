<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89c2d9"/>
      <stop offset="35%" stop-color="#bfe0ec"/>
      <stop offset="70%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#fdfdfc"/>
    </linearGradient>
    <linearGradient id="tower1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="tower2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70a9cd"/>
      <stop offset="100%" stop-color="#4682b4"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fa8d3"/>
      <stop offset="40%" stop-color="#2a6f97"/>
      <stop offset="100%" stop-color="#014f86"/>
    </linearGradient>
    <linearGradient id="greenery" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="50%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="820" fill="url(#skyGrad)"/>

  <!-- Sun Glow -->
  <circle cx="850" cy="220" r="140" fill="#ffdda1" opacity="0.45" filter="url(#softGlow)"/>
  <circle cx="850" cy="220" r="80" fill="#fff3c4" opacity="0.6"/>

  <!-- Distant Nature Hill Silhouette -->
  <path d="M0 640 Q 300 590 600 620 T 1200 610 L 1200 820 L 0 820 Z" fill="#9bb3a8" opacity="0.5"/>

  <!-- Tower 1: Background Left -->
  <g opacity="0.9">
    <rect x="140" y="240" width="130" height="420" rx="3" fill="url(#tower2)"/>
    <!-- Glass balconies -->
    <path d="M 150 260 H 260 M 150 280 H 260 M 150 300 H 260 M 150 320 H 260 M 150 340 H 260 M 150 360 H 260 M 150 380 H 260 M 150 400 H 260 M 150 420 H 260 M 150 440 H 260 M 150 460 H 260 M 150 480 H 260 M 150 500 H 260 M 150 520 H 260 M 150 540 H 260 M 150 560 H 260 M 150 580 H 260 M 150 600 H 260 M 150 620 H 260" stroke="#70a9cd" stroke-width="4" opacity="0.65"/>
    <!-- Crown Finial -->
    <rect x="160" y="222" width="90" height="18" fill="#1b365d" rx="2"/>
  </g>

  <!-- Tower 2: Center Main High-Rise (G+42 Iconic Tower) -->
  <g>
    <rect x="290" y="140" width="170" height="520" rx="4" fill="url(#tower1)"/>
    <!-- Vertical Spine & Fins -->
    <rect x="365" y="140" width="20" height="520" fill="#1b365d" opacity="0.15"/>
    <rect x="305" y="170" width="60" height="470" fill="url(#glass)" opacity="0.3"/>
    <rect x="385" y="170" width="60" height="470" fill="url(#glass)" opacity="0.3"/>
    <!-- Balcony Strips -->
    <path d="M 300 180 H 450 M 300 205 H 450 M 300 230 H 450 M 300 255 H 450 M 300 280 H 450 M 300 305 H 450 M 300 330 H 450 M 300 355 H 450 M 300 380 H 450 M 300 405 H 450 M 300 430 H 450 M 300 455 H 450 M 300 480 H 450 M 300 505 H 450 M 300 530 H 450 M 300 555 H 450 M 300 580 H 450 M 300 605 H 450 M 300 630 H 450" stroke="#ffffff" stroke-width="3.5" opacity="0.95"/>
    <!-- Crown architectural accent -->
    <rect x="310" y="118" width="130" height="22" fill="#1b365d" rx="3"/>
    <rect x="330" y="105" width="90" height="13" fill="#f77f00" rx="2"/>
  </g>

  <!-- Tower 3: Right Center Tower -->
  <g>
    <rect x="480" y="190" width="160" height="470" rx="4" fill="url(#tower2)"/>
    <rect x="495" y="220" width="130" height="420" fill="url(#glass)" opacity="0.25"/>
    <path d="M 490 220 H 630 M 490 245 H 630 M 490 270 H 630 M 490 295 H 630 M 490 320 H 630 M 490 345 H 630 M 490 370 H 630 M 490 395 H 630 M 490 420 H 630 M 490 445 H 630 M 490 470 H 630 M 490 495 H 630 M 490 520 H 630 M 490 545 H 630 M 490 570 H 630 M 490 595 H 630 M 490 620 H 630" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <!-- Crown -->
    <rect x="500" y="170" width="120" height="20" fill="#1b365d" rx="2"/>
  </g>

  <!-- Tower 4: Far Right Tower -->
  <g opacity="0.85">
    <rect x="660" y="270" width="140" height="390" rx="3" fill="url(#tower1)"/>
    <path d="M 670 290 H 790 M 670 315 H 790 M 670 340 H 790 M 670 365 H 790 M 670 390 H 790 M 670 415 H 790 M 670 440 H 790 M 670 465 H 790 M 670 490 H 790 M 670 515 H 790 M 670 540 H 790 M 670 565 H 790 M 670 590 H 790 M 670 615 H 790" stroke="#70a9cd" stroke-width="3" opacity="0.6"/>
    <!-- Crown -->
    <rect x="680" y="252" width="100" height="18" fill="#1b365d" rx="2"/>
  </g>

  <!-- Lush Lakeside Greenery & Landscape Podium -->
  <path d="M 0 660 Q 200 630 450 645 T 900 640 T 1200 655 L 1200 820 L 0 820 Z" fill="url(#greenery)"/>

  <!-- Cheemasandra Lake Water Body -->
  <path d="M 120 720 C 350 710 650 730 1200 705 L 1200 820 L 120 820 Z" fill="url(#lakeGrad)" opacity="0.88"/>
  <ellipse cx="600" cy="760" rx="420" ry="20" fill="#ffffff" opacity="0.18"/>
  <ellipse cx="750" cy="780" rx="300" ry="12" fill="#ffffff" opacity="0.15"/>

  <!-- Forefront Trees & Foliage -->
  <circle cx="80" cy="670" r="70" fill="#2d6a4f" opacity="0.9"/>
  <circle cx="160" cy="690" r="55" fill="#40916c" opacity="0.95"/>
  <circle cx="240" cy="700" r="45" fill="#52b788" opacity="0.85"/>
  <circle cx="1060" cy="680" r="85" fill="#1b4332" opacity="0.9"/>
  <circle cx="1140" cy="695" r="75" fill="#2d6a4f" opacity="0.95"/>

  <!-- Sattva Builder Watermark / Badge Accent -->
  <g transform="translate(60, 60)">
    <rect x="0" y="12" width="5" height="16" rx="2" fill="#00b4d8"/>
    <rect x="8" y="8" width="5" height="20" rx="2" fill="#ffb703"/>
    <rect x="16" y="4" width="5" height="24" rx="2" fill="#55a630"/>
    <rect x="24" y="0" width="5" height="28" rx="2" fill="#e63946"/>
    <text x="38" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#1b365d" letter-spacing="3">SATTVA AANGANÉ</text>
    <text x="38" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#64748b" letter-spacing="2">LAKESIDE SANCTUARY · BUDIGERE CROSS</text>
  </g>
</svg>
